name: Build APK

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk mediar.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediar-apk
          path: mediar.apk

      # آخرین APK هر شاخه به‌صورت یک Release هم منتشر می‌شود تا مستقیم از گوشی دانلود شود
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="apk-$(echo "$BRANCH" | tr '/' '-')"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" mediar.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Mediar APK ($BRANCH) #$GITHUB_RUN_NUMBER" \
            --notes "Built from $GITHUB_SHA"
